name: Ajustar modelo bayesiano
on:
  schedule:
    - cron: "0 13 * * 2"    # martes 13:00 UTC = 7:00 am Guatemala (la BBDD ya se actualizó a las 6:00)
  workflow_dispatch:         # botón "Run workflow" para correrlo a mano
permissions:
  contents: write
jobs:
  ajustar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy scipy matplotlib pymc arviz
      - run: python modelo_bayes.py ajustar todas
      - uses: actions/upload-artifact@v4       # las gráficas de diagnóstico se guardan aquí (no en el repo)
        with:
          name: diagnosticos_bayes
          path: diagnosticos_bayes/*.png
          retention-days: 30
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add modelos_bayes/*.npz diagnosticos_bayes/*.csv
          git commit -m "Modelo bayesiano reajustado $(date +%d/%m/%Y)" || echo "sin cambios"
          git push
