name: Actualizar BBDD ligas
on:
  schedule:
    - cron: "0 12 * * *" # 6:00 am Guatemala
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/actualizar.yaml"
permissions:
  contents: write
concurrency:
  group: actualizar-bbdd
  cancel-in-progress: false
jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas openpyxl requests
      - run: python generar_bbdd.py
      - run: python validar_bbdd.py
      - run: |
          python logos.py || echo "logos: sin cambios (ESPN no respondio)"
      - name: Publicar datos validados
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add datos/
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos"
          else
            git commit -m "BBDD actualizada $(date +%d/%m/%Y)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
