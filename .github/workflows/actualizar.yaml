name: Actualizar BBDD ligas
on:
  schedule:
    - cron: "0 12 * * *"   # todos los dias 12:00 UTC = 6:00 am Guatemala
  workflow_dispatch:        # boton "Run workflow" para correrlo a mano
permissions:
  contents: write
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas openpyxl requests
      - run: python generar_bbdd.py
      - run: python validar_bbdd.py
      - run: python logos.py || echo "logos: sin cambios (ESPN no respondio)"
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add datos/
          git commit -m "BBDD actualizada $(date +%d/%m/%Y)" || echo "sin cambios"
          git push