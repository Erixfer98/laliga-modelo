name: Sondeo xG (temporal, no va a main)
on:
  push:
    branches: [xg-fotmob]
    paths:
      - "fotmob.py"
      - "sondeo/diag.py"
      - ".github/workflows/sondeo_xg.yml"
permissions:
  contents: write
jobs:
  sondeo:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas openpyxl requests
      - run: PYTHONPATH=. python sondeo/diag.py 2>&1 | grep -v "^OK ->" | tee sondeo/salida.txt
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add sondeo/ datos/xg_*.csv
          git commit -m "xG de FotMob (corrida de prueba en la rama)" || exit 0
          git stash --include-untracked
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
