name: Champions - carga inicial (temporal, se borra antes del merge)
on:
  push:
    branches: [champions]
    paths:
      - ".github/workflows/champions-temporal.yml"
permissions:
  contents: write
jobs:
  datos:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas openpyxl requests
      - run: python generar_bbdd.py champions --completo
      - run: python validar_bbdd.py
      - run: python logos.py || echo "logos: ESPN no respondio"
      - name: Subir datos de Champions a la rama
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add datos/bbdd_champions.csv datos/bbdd_champions.xlsx datos/logos.json
          git commit -m "Champions: BBDD inicial desde ESPN" || echo "sin cambios"
          git push origin HEAD:champions
